<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&family=Share+Tech+Mono&display=swap">
<title>محاسبه آنلاین سود و قسط خرید اقساطی</title>
<style>
:root{--bg:#f2f2f7;--text:#000;--op:#5fa832;--gl:rgba(255,255,255,.55);--gl2:rgba(255,255,255,.32);--bd:rgba(255,255,255,.85);--hl:rgba(255,255,255,.9);--sh:rgba(50,90,30,.2);--bgA:#cdeeb4;--bgB:#b9e0f4;--bgC:#f3f7bd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--text:#fff;--op:#7cc64f;--gl:rgba(255,255,255,.14);--gl2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.22);--hl:rgba(255,255,255,.3);--sh:rgba(0,0,0,.55);--bgA:#16421a;--bgB:#0c2a44;--bgC:#2f4214}}
:root[data-theme="dark"]{--bg:#000;--text:#fff;--op:#7cc64f;--gl:rgba(255,255,255,.14);--gl2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.22);--hl:rgba(255,255,255,.3);--sh:rgba(0,0,0,.55);--bgA:#16421a;--bgB:#0c2a44;--bgC:#2f4214}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:radial-gradient(60% 38% at 12% 8%,var(--bgA),transparent 72%),radial-gradient(55% 38% at 92% 32%,var(--bgB),transparent 72%),radial-gradient(65% 40% at 28% 100%,var(--bgC),transparent 72%),var(--bg);background-attachment:fixed}
body{margin:0 auto;width:100%;max-width:480px;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;padding:18px 14px 24px;color:var(--text);font-family:"IRANSans","IRANSansX","Vazirmatn",-apple-system,system-ui,sans-serif}
h1{font-size:18px;font-weight:600;margin:6px 4px 8px;text-align:center}
label{display:block;font-size:13px;margin:10px 4px 4px;opacity:.7}
input{width:100%;font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;color:var(--text);background:var(--gl);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--bd);box-shadow:inset 0 2px 1px var(--hl),0 6px 14px var(--sh);direction:ltr;text-align:right;outline:0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);transition:transform .12s}
button:active{transform:scale(.96)}
.tabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--gl2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--bd);box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.tabs button{flex:1;border:0;border-radius:10px;padding:10px;font-size:15px;background:transparent;color:var(--text)}
.tabs button.sel{background:var(--gl);box-shadow:inset 0 1px 0 var(--hl),0 3px 10px var(--sh)}
#go,.go{width:100%;margin-top:20px;padding:15px;border-radius:14px;font-size:18px;color:#fff;border-color:rgba(255,255,255,.55);background:linear-gradient(165deg,rgba(255,255,255,.45),rgba(255,255,255,0) 50%),var(--op);box-shadow:inset 0 2px 1px var(--hl),0 8px 18px var(--sh);display:flex;align-items:center;justify-content:center;gap:8px}
.res{margin-top:18px;padding:4px 16px;border-radius:16px;background:var(--gl);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);border:1px solid var(--bd);box-shadow:inset 0 2px 1px var(--hl),0 10px 24px var(--sh)}
.res div{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid rgba(128,128,128,.22)}
.res div:last-child{border:0}
.res b{font-size:18px}
.res .hl b{color:var(--op)}
input::placeholder{font-size:12px;color:var(--text);opacity:.35}
.top{position:relative}
.top h1{padding:0 42px}
#theme,#back{position:absolute;left:0;top:50%;margin-top:-17px;width:34px;height:34px;padding:0;border-radius:50%;font-size:16px;line-height:1;background:var(--gl);color:var(--text);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 1px var(--hl),0 4px 10px var(--sh)}
.res small{font-size:12px;margin-inline-start:6px}
.up{color:var(--op)}
.dn{color:#e5484d}
.row{display:flex;gap:10px}
.row>div{flex:1;min-width:0}
footer{margin-top:22px;text-align:center;font-size:13px;opacity:.65}
#back{left:auto;right:0;display:none;align-items:center;justify-content:center}
#back.on{display:flex}
.view{display:none}
.view.on{display:block}
.home.on{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 4px}
.tile{aspect-ratio:1;border-radius:30px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:15px;line-height:1.5;text-align:center;color:var(--text);background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--bd);box-shadow:inset 0 2px 1px var(--hl),inset 0 -4px 10px rgba(0,0,0,.06),0 12px 28px var(--sh)}
.tile svg{width:44px;height:44px}
.tile .ic{font-size:40px;line-height:1}
.tile.soon{opacity:.55}
.msg{text-align:center;opacity:.7;padding:40px 0}
.dt b{display:block;font-size:15px}
.dt small{display:block;margin:2px 0 0;font-size:12px;opacity:.7}
.dt div>span:last-child{text-align:left}
.note{font-size:12px;opacity:.6;text-align:center;margin:12px 4px 0}
.lcd{position:relative;margin:6px 0 16px;padding:16px 14px 12px;border-radius:16px;direction:ltr;overflow:hidden;font-family:"Share Tech Mono","Courier New",monospace;background:linear-gradient(180deg,#d0dcba,#b3c39c);border:1px solid rgba(0,0,0,.3);box-shadow:inset 0 4px 10px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.35),0 8px 20px var(--sh)}
.lcd::before{content:"88888888888888";position:absolute;right:14px;bottom:42px;font-size:34px;line-height:1.3;letter-spacing:1px;white-space:nowrap;color:#1c2b18;opacity:.07}
#cdisp{position:relative;display:block;min-height:44px;text-align:right;font-size:34px;line-height:1.3;letter-spacing:1px;font-weight:400;white-space:nowrap;overflow:hidden;color:#1c2b18;cursor:pointer}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.k{aspect-ratio:1;border-radius:50%;font-size:28px;padding:0;color:var(--text);background:var(--gl);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);box-shadow:inset 0 2px 1px var(--hl),inset 0 -3px 6px rgba(0,0,0,.07),0 8px 18px var(--sh)}
.k.fn{background:var(--gl2)}
.k.op{color:#fff;font-size:34px;border-color:rgba(255,255,255,.55);background:linear-gradient(165deg,rgba(255,255,255,.45),rgba(255,255,255,0) 50%),var(--op)}
.k.op.on{background:#fff;color:var(--op)}
.k.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;text-align:start;padding-inline-start:12%}
.lcd-tools{position:relative;display:flex;align-items:center;gap:6px;margin-top:6px;height:22px}
.lcd-tools button{width:22px;height:22px;padding:0;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(28,43,24,.08);color:#1c2b18;border:1px solid rgba(28,43,24,.35);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.lcd-tools svg{width:13px;height:13px}
#kmsg{font-family:"Vazirmatn",system-ui,sans-serif;font-size:11px;color:#1c2b18;opacity:.75;direction:rtl}
#theme{position:static;margin:0}
.gfoot{display:flex;justify-content:center;margin-top:24px}
</style>
</head>
<body>
<div class="top"><h1 id="ttl">ابزار کاربردی</h1><button id="back" aria-label="بازگشت"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
<div class="view home on" id="v-home">
<button class="tile" data-go="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="3"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>ماشین حساب</button>
<button class="tile" data-go="loan"><span class="ic">٪</span>محاسبه قسط</button>
<button class="tile" data-go="crypto"><span class="ic">₿</span>قیمت ارز دیجیتال</button>
<button class="tile" data-go="date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>تبدیل تاریخ</button>
</div>
<div class="view" id="v-loan">
<label>مبلغ وام (تومان)</label><input id="amt" inputmode="numeric" placeholder="مبلغ وارد کنید">
<div class="row"><div><label>تعداد ماه</label><input id="mon" inputmode="numeric" placeholder="تعداد ماه وارد کنید"></div>
<div><label>نرخ سود ماهانه (درصد)</label><input id="rate" inputmode="decimal" placeholder="نرخ سود وارد کنید"></div></div>
<label>روش محاسبه</label>
<div class="tabs" id="meth"><button data-m="simple" class="sel">بازاری</button><button data-m="dec">بانکی</button></div>
<button id="go"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="3"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>محاسبه</button>
<div class="res">
<div class="hl"><span>قسط ماهانه</span><b id="r1">—</b></div>
<div><span>کل سود</span><b id="r2">—</b></div>
<div><span>مجموع بازپرداخت</span><b id="r3">—</b></div>
</div>
<footer>روش محاسبه صحیح و آسان سود اقساط کالا</footer>
</div>
<div class="view" id="v-crypto">
<div class="res">
<div><span>بیت‌کوین</span><span><b id="c-bitcoin">—</b><small id="d-bitcoin"></small></span></div>
<div><span>اتریوم</span><span><b id="c-ethereum">—</b><small id="d-ethereum"></small></span></div>
<div><span>تتر</span><span><b id="c-tether">—</b><small id="d-tether"></small></span></div>
<div><span>بایننس‌کوین</span><span><b id="c-binancecoin">—</b><small id="d-binancecoin"></small></span></div>
</div>
</div>
<div class="view" id="v-calc">
<div class="lcd"><div id="cdisp" title="برای حذف رقم آخر لمس کنید">0</div>
<div class="lcd-tools"><button id="kcopy" aria-label="کپی" title="کپی"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button><button id="kpaste" aria-label="چسباندن" title="چسباندن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/></svg></button><span id="kmsg"></span></div></div>
<div class="kb" id="kb">
<button class="k fn" data-k="ac" id="kac">AC</button><button class="k fn" data-k="neg">±</button><button class="k fn" data-k="pct">%</button><button class="k op" data-k="/">÷</button>
<button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button><button class="k op" data-k="*">×</button>
<button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button><button class="k op" data-k="-">−</button>
<button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button><button class="k op" data-k="+">+</button>
<button class="k zero" data-k="0">0</button><button class="k" data-k=".">.</button><button class="k op" data-k="=">=</button>

</div>
</div>
<div class="view" id="v-date">
<label>تقویم ورودی</label>
<div class="tabs" id="dcal"><button data-c="persian" class="sel">شمسی</button><button data-c="gregory">میلادی</button><button data-c="islamic-umalqura">قمری</button></div>
<div class="row"><div><label>سال</label><input id="dy" inputmode="numeric"></div>
<div><label>ماه</label><input id="dm" inputmode="numeric"></div>
<div><label>روز</label><input id="dd" inputmode="numeric"></div></div>
<button class="go" id="dconv">تبدیل</button>
<div class="res dt">
<div class="hl"><span>شمسی</span><span><b id="o1">—</b><small id="n1"></small></span></div>
<div><span>میلادی</span><span><b id="o2">—</b><small id="n2"></small></span></div>
<div><span>قمری</span><span><b id="o3">—</b><small id="n3"></small></span></div>
</div>
<p class="note">تاریخ قمری بر پایهٔ تقویم أم‌القری است و ممکن است تا یک روز با رصد رسمی ایران فرق داشته باشد.</p>
</div>
<div class="gfoot"><button id="theme" aria-label="حالت تاریک"></button></div>
<script>
var method="simple",ids=["r1","r2","r3"];
function el(i){return document.getElementById(i)}
function en(s){return s.replace(/[\u06F0-\u06F9]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-1632}).replace(/\u066B|\u060C/g,".")}
function money(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function clear(){ids.forEach(function(i){el(i).textContent="—"})}
function calcLoan(){
  var P=parseFloat(en(el("amt").value).replace(/,/g,""));
  var n=parseInt(en(el("mon").value),10);
  var r=parseFloat(en(el("rate").value))*12;
  if(!(P>0)||!(n>0)||isNaN(r)||r<0){clear();return}
  var pmt,total;
  if(method==="simple"){total=P+P*r/100*n/12;pmt=total/n}
  else{var i=r/1200;pmt=i===0?P/n:P*i/(1-Math.pow(1+i,-n));total=pmt*n}
  el("r1").textContent=money(pmt)+" تومان";
  el("r2").textContent=money(total-P)+" تومان";
  el("r3").textContent=money(total)+" تومان";
}
el("amt").addEventListener("input",function(e){
  var v=en(e.target.value).replace(/\D/g,"");
  e.target.value=v.replace(/\B(?=(\d{3})+(?!\d))/g,",");clear();
});
el("mon").addEventListener("input",function(e){e.target.value=en(e.target.value).replace(/\D/g,"");clear()});
el("rate").addEventListener("input",function(e){e.target.value=en(e.target.value).replace(/[^0-9.]/g,"");clear()});
el("meth").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  method=b.dataset.m;
  this.querySelectorAll("button").forEach(function(x){x.classList.toggle("sel",x===b)});clear();
});
var RATE_URL="";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  el("theme").textContent=t==="dark"?"☀️":"🌙";
}
var theme;
try{theme=localStorage.getItem("theme")}catch(e){}
if(theme!=="dark"&&theme!=="light")theme=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
applyTheme(theme);
el("theme").addEventListener("click",function(){
  theme=theme==="dark"?"light":"dark";
  applyTheme(theme);
  try{localStorage.setItem("theme",theme)}catch(e){}
});
var CRYPTO_URL="https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,binancecoin&vs_currencies=usd&include_24hr_change=true";
var COINS=["bitcoin","ethereum","tether","binancecoin"];
var haveIRT=false;
function paint(k,v,u,ch){
  if(!(v>0))return;
  el("c-"+k).textContent=v.toLocaleString("fa-IR",{maximumFractionDigits:v<10?4:(u==="دلار"?2:0)})+" "+u;
  var de=el("d-"+k);
  if(typeof ch==="number"&&isFinite(ch)){
    de.textContent=(ch>0?"+":"")+Number(ch.toFixed(2)).toLocaleString("fa-IR")+"٪";
    de.className=ch>=0?"up":"dn";
  }
}
function loadCrypto(){
  fetch(CRYPTO_URL).then(function(r){return r.json()}).then(function(d){
    if(haveIRT)return;
    COINS.forEach(function(k){if(d[k])paint(k,d[k].usd,"دلار",d[k].usd_24h_change)});
  }).catch(function(){});
}
loadCrypto();setInterval(loadCrypto,60000);
function loadRates(){
  if(!RATE_URL)return;
  fetch(RATE_URL).then(function(r){return r.json()}).then(function(d){
    if(d&&d.coins){haveIRT=true;COINS.forEach(function(k){var c=d.coins[k];if(c)paint(k,c.irt,"تومان",c.chg)})}
  }).catch(function(){});
}
loadRates();setInterval(loadRates,60000);
el("go").addEventListener("click",function(){
  if(document.activeElement)document.activeElement.blur();
  calcLoan();
});
var TITLES={home:"ابزار کاربردی",calc:"ماشین حساب",loan:"محاسبه آنلاین سود و قسط خرید اقساطی",crypto:"قیمت ارز دیجیتال",date:"تبدیل تاریخ"};
var nav=0;
function route(){
  var h=(location.hash||"").replace("#","");
  var v=Object.prototype.hasOwnProperty.call(TITLES,h)?h:"home";
  document.querySelectorAll(".view").forEach(function(x){x.classList.toggle("on",x.id==="v-"+v)});
  el("ttl").textContent=TITLES[v];
  el("back").classList.toggle("on",v!=="home");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
document.querySelectorAll(".tile").forEach(function(b){
  b.addEventListener("click",function(){nav++;location.hash=b.dataset.go});
});
el("back").addEventListener("click",function(){
  if(nav>0){nav--;history.back()}else{location.replace("#home")}
});
route();

/* ---- calculator ---- */
var kc="0",kp=null,ko=null,kf=false;
function kfmt(s){
  if(s==="خطا"||s.indexOf("e")>-1)return s;
  var p=s.split("."),i=p[0],neg=i[0]==="-";
  if(neg)i=i.slice(1);
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (neg?"-":"")+i+(p.length>1?"."+p[1]:"");
}
function knorm(n){return isFinite(n)?String(parseFloat(n.toPrecision(12))):"خطا"}
function kcalc(a,b,o){
  if(o==="+")return a+b;if(o==="-")return a-b;if(o==="*")return a*b;
  return b===0?Infinity:a/b;
}
function krender(){
  var t=kfmt(kc);
  el("cdisp").textContent=t;
  el("kac").textContent=((kc!=="0"&&!kf)||(ko&&kc!=="0"))?"C":"AC";
  document.querySelectorAll(".k.op").forEach(function(b){b.classList.toggle("on",kf&&ko&&b.dataset.k===ko)});
}
function kpress(k){
  if(kc==="خطا"&&k!=="ac")kc="0";
  if(/^[0-9]$/.test(k)){
    if(kf||kc==="0"){kc=k;kf=false}
    else if(kc.replace(/[-.]/g,"").length<12)kc+=k;
  }else if(k==="."){
    if(kf){kc="0.";kf=false}
    else if(kc.indexOf(".")<0)kc+=".";
  }else if(k==="ac"){
    if(el("kac").textContent==="C"){kc="0";kf=false}
    else{kc="0";kp=null;ko=null;kf=false}
  }else if(k==="neg"){
    if(kc!=="0")kc=kc[0]==="-"?kc.slice(1):"-"+kc;
  }else if(k==="pct"){
    kc=knorm(parseFloat(kc)/100);
  }else if(k==="="){
    if(ko!==null&&kp!==null){kc=knorm(kcalc(kp,parseFloat(kc),ko));kp=null;ko=null;kf=true}
  }else{
    if(ko!==null&&kp!==null&&!kf)kc=knorm(kcalc(kp,parseFloat(kc),ko));
    kp=parseFloat(kc);ko=k;kf=true;
    if(kc==="خطا"){kp=null;ko=null}
  }
  krender();
}
el("kb").addEventListener("click",function(e){var b=e.target.closest("button");if(b)kpress(b.dataset.k)});
el("cdisp").addEventListener("click",function(){
  if(kf||kc==="خطا")return;
  kc=kc.length>1&&!(kc.length===2&&kc[0]==="-")?kc.slice(0,-1):"0";
  krender();
});

/* ---- copy / paste ---- */
var kt;
function kmsg(t){var m=el("kmsg");m.textContent=t;clearTimeout(kt);kt=setTimeout(function(){m.textContent=""},1500)}
function kcopy(){
  var txt=kc==="خطا"?"":kc;
  if(!txt){kmsg("چیزی برای کپی نیست");return}
  function fb(){
    var ta=document.createElement("textarea");
    ta.value=txt;ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;opacity:0;top:0;left:0";
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99);
    var ok=false;try{ok=document.execCommand("copy")}catch(e){}
    document.body.removeChild(ta);kmsg(ok?"کپی شد":"کپی نشد");
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){kmsg("کپی شد")},fb)}
  else fb();
}
function kapply(raw){
  var v=en(String(raw).replace(/\u066C/g,"")).replace(/[\s,]/g,"").replace(/\u2212/g,"-");
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(v)){kmsg("عدد معتبر نیست");return}
  kc=knorm(parseFloat(v));kf=false;krender();kmsg("چسبانده شد");
}
function kask(){var t=window.prompt("عدد را اینجا بچسبانید");if(t!==null)kapply(t)}
function kpaste(){
  if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(kapply,kask)}
  else kask();
}
el("kcopy").addEventListener("click",kcopy);
el("kpaste").addEventListener("click",kpaste);

/* ---- date converters ---- */
function fa(s){return String(s).replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".charAt(d)})}
function pad(n){return n<10?"0"+n:""+n}
function dparts(date,cal){
  var o={};
  new Intl.DateTimeFormat("en-u-ca-"+cal+"-nu-latn",{year:"numeric",month:"numeric",day:"numeric",timeZone:"UTC"})
    .formatToParts(date).forEach(function(p){if(p.type==="year"||p.type==="month"||p.type==="day")o[p.type]=parseInt(p.value,10)});
  return o;
}
function longTxt(date,cal){
  var p=dparts(date,cal);
  var wd=new Intl.DateTimeFormat("fa-IR",{weekday:"long",timeZone:"UTC"}).format(date);
  var mn=new Intl.DateTimeFormat("fa-IR-u-ca-"+cal,{month:"long",timeZone:"UTC"}).format(date);
  return wd+" "+fa(p.day)+" "+mn+" "+fa(p.year);
}
function numTxt(p){return fa(p.year+"/"+pad(p.month)+"/"+pad(p.day))}
function gdate(y,m,d){
  if(!(y>=100)||!(m>=1&&m<=12)||!(d>=1&&d<=31))return null;
  var dt=new Date(Date.UTC(y,m-1,d,12));
  return(dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d)?dt:null;
}
function j2g(y,m,d){
  if(!(y>=1)||!(m>=1&&m<=12)||!(d>=1&&d<=31))return null;
  var base=Date.UTC(y+621,2,21,12);
  var off=(m<=6?(m-1)*31:186+(m-7)*30)+(d-1);
  for(var k=-4;k<=4;k++){
    var dt=new Date(base+(off+k)*864e5),p=dparts(dt,"persian");
    if(p.year===y&&p.month===m&&p.day===d)return dt;
  }
  return null;
}
function num(id){return parseInt(el(id).value,10)}
function h2g(y,m,d){
  if(!(y>=1)||!(m>=1&&m<=12)||!(d>=1&&d<=30))return null;
  var base=Math.round(-492148+(y-1)*354.367056+(m-1)*29.530589+(d-1));
  for(var k=-4;k<=4;k++){
    var dt=new Date((base+k)*864e5+432e5),p=dparts(dt,"islamic-umalqura");
    if(p.year===y&&p.month===m&&p.day===d)return dt;
  }
  return null;
}
function toDate(cal,y,m,d){
  if(cal==="gregory")return gdate(y,m,d);
  if(cal==="persian")return j2g(y,m,d);
  return h2g(y,m,d);
}
var curCal="persian",CALS=[["persian","o1","n1"],["gregory","o2","n2"],["islamic-umalqura","o3","n3"]];
function todayUTC(){var n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate(),12))}
function setInputs(p){el("dy").value=p.year;el("dm").value=p.month;el("dd").value=p.day}
function fillOut(dt){
  CALS.forEach(function(c){
    el(c[1]).textContent=longTxt(dt,c[0]);
    el(c[2]).textContent=numTxt(dparts(dt,c[0]));
  });
}
function badOut(){
  CALS.forEach(function(c,i){el(c[1]).textContent=i?"—":"تاریخ نامعتبر است";el(c[2]).textContent=""});
}
["dy","dm","dd"].forEach(function(id){
  el(id).addEventListener("input",function(e){e.target.value=en(e.target.value).replace(/\D/g,"")});
});
el("dconv").addEventListener("click",function(){
  if(document.activeElement)document.activeElement.blur();
  try{
    var dt=toDate(curCal,num("dy"),num("dm"),num("dd"));
    if(!dt){badOut();return}
    fillOut(dt);
  }catch(e){badOut()}
});
el("dcal").addEventListener("click",function(e){
  var b=e.target.closest("button");
  if(!b||b.dataset.c===curCal)return;
  var old=null;
  try{old=toDate(curCal,num("dy"),num("dm"),num("dd"))}catch(x){}
  old=old||todayUTC();
  curCal=b.dataset.c;
  this.querySelectorAll("button").forEach(function(x){x.classList.toggle("sel",x===b)});
  setInputs(dparts(old,curCal));
  fillOut(old);
});
try{
  var t0=todayUTC();
  setInputs(dparts(t0,"persian"));
  fillOut(t0);
}catch(e){}
</script>
